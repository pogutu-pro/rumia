<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>$HEADING</title>
</head>
<body style="margin:0; padding:0; background-color:#f9fafb; -webkit-text-size-adjust:100%;">
  <!-- Preheader -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">
    $HEADING
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f9fafb;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; width:100%;">

          <!-- Brand header -->
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align:middle;">
                    <span style="font-size:26px; font-weight:800; letter-spacing:-0.5px; color:#111827; font-family:Arial, Helvetica, sans-serif;">rumia</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background-color:#ffffff; border-radius:12px; padding:28px 24px; font-family:Arial, Helvetica, sans-serif; color:#111827; box-shadow:0 1px 3px rgba(16,24,40,0.06);">

              <!-- Eyebrow -->
              <div style="font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#6b7280; margin-bottom:8px;">Rumia Hostel Updates</div>

              <!-- Heading -->
              <h1 style="margin:0 0 12px; font-size:21px; line-height:1.35; color:#111827;">$HEADING</h1>

              <!-- Content -->
              <div style="font-size:15px; line-height:1.65; color:#374151;">
                $CONTENT
              </div>

              <!-- CTA -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:24px 0 8px;">
                <tr>
                  <td align="left">
                    <a href="$CTA_URL" style="background-color:#6d28d9; color:#ffffff; text-decoration:none; font-weight:700; font-size:15px; padding:12px 24px; border-radius:8px; display:inline-block; $CTA_HIDDEN">
                      $CTA_LABEL
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 8px 0; font-family:Arial, Helvetica, sans-serif; color:#6b7280; font-size:12px; line-height:1.5;">
              <p style="margin:0 0 8px;">You're receiving this because you added a hostel to your Wishlist on Rumia.</p>
              <p style="margin:0 0 8px;">
                <a href="$SETTINGS_URL" style="color:#6d28d9; text-decoration:underline;">Manage notification preferences</a>
              </p>
              <p style="margin:0 0 12px;">$FOOTER_NOTE</p>
              <p style="margin:0; color:#9ca3af;">© $YEAR Rumia · Nairobi, Kenya</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
