[project]
name = "rumia-backend"
version = "0.1.0"
description = "Rumia Independent FastAPI Backend Services (Vertical Slice Architecture)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "pywebpush>=1.14.0",
    "gunicorn>=23.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "slowapi>=0.1.9",
    "posthog>=7.48.0",
    "alembic>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
env = [
    "ENVIRONMENT=test",
    "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/postgres",
    "SUPABASE_JWT_SECRET=test_secret_32_bytes_long_string_for_testing!!",
    "SUPABASE_URL=https://test.supabase.co",
    "RATE_LIMIT_ENABLED=false",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-env>=1.1.0",
]
