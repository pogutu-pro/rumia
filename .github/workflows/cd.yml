name: CD (Automated Oracle VPS Deployment)

on:
  push:
    branches: [ main, master ]

# Ensure CD only runs if CI passes
jobs:
  deploy:
    name: Auto-Deploy to Oracle VPS (Johannesburg)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Oracle VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VPS_HOST }}
          username: ${{ secrets.ORACLE_VPS_USER }}
          key: ${{ secrets.ORACLE_VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.ORACLE_VPS_USER }}/rumia
            # Recover from any leftover conflicted working tree BEFORE running
            # the deploy script (env files are gitignored, certbot/ untracked).
            git fetch origin main 2>/dev/null || git fetch origin master 2>/dev/null
            git reset --hard origin/main 2>/dev/null || git reset --hard origin/master
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
