user nginx;
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow image uploads through the Next.js /api/images/process handler
    client_max_body_size 30m;

    # Rate limiting zone for API protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # HTTP Server Block (Redirect HTTP to HTTPS + Certbot challenge)
    server {
        listen 80 default_server;
        server_name rumia.co.ke www.rumia.co.ke;

        # Allow Let's Encrypt Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS on the canonical host (one hop)
        location / {
            return 301 https://rumia.co.ke$request_uri;
        }
    }

    # HTTPS Server Block
    server {
        listen 443 ssl http2;
        server_name rumia.co.ke www.rumia.co.ke;

        # One canonical host. Google sign-in returns to rumia.co.ke and the OAuth state cookie is
        # host-only, so a sign-in started on www can never complete (oauth_state_expired).
        if ($host = www.rumia.co.ke) {
            return 301 https://rumia.co.ke$request_uri;
        }

        # SSL Certificates (Managed by Certbot)
        ssl_certificate /etc/letsencrypt/live/rumia.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rumia.co.ke/privkey.pem;

        # SSL Parameters & Security Optimization
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Route API requests to FastAPI Backend container
        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend:8000/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # FastAPI Interactive Swagger Docs
        location /docs {
            proxy_pass http://backend:8000/docs;
            proxy_set_header Host $host;
        }

        # Route web requests to Next.js Frontend container
        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Auth responses carry large header blocks (Supabase session JWTs in
            # Set-Cookie plus CSP/security headers). The default proxy buffer
            # (4k-8k) is too small, and nginx replies 502 "upstream sent too big
            # header" exactly on the login success path /login page RSC requests.
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
        }
    }
}
