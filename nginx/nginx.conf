user nginx;
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Real client IP ──────────────────────────────────────────────────────────
    # The site is behind Cloudflare, which sends the visitor's address in CF-Connecting-IP. Trust that
    # header only for connections that really come from Cloudflare, so a client cannot forge its IP.
    # Cloudflare ranges: https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
    # (review them occasionally; they change rarely).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Server-to-server calls from the web container carry the end user's address in
    # X-Rumia-Client-IP. Honour it only for connections from the internal Docker network;
    # from anywhere else it is ignored (and removed before proxying).
    geo $from_internal {
        default 0;
        127.0.0.0/8 1;
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;
    }
    map $from_internal $internal_client_ip {
        1 $http_x_rumia_client_ip;
        default "";
    }
    map $internal_client_ip $client_ip {
        "" $remote_addr;
        default $internal_client_ip;
    }

    # Allow image uploads through the Next.js /api/images/process handler
    client_max_body_size 30m;

    # Rate limiting zone for API protection (per real client address)
    limit_req_zone $client_ip zone=api_limit:10m rate=30r/s;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # HTTP Server Block (Redirect HTTP to HTTPS + Certbot challenge)
    server {
        listen 80 default_server;
        server_name rumia.co.ke www.rumia.co.ke;

        # Allow Let's Encrypt Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS on the canonical host (one hop)
        location / {
            return 301 https://rumia.co.ke$request_uri;
        }
    }

    # HTTPS Server Block
    server {
        listen 443 ssl http2;
        server_name rumia.co.ke www.rumia.co.ke;

        # One canonical host. Google sign-in returns to rumia.co.ke and the OAuth state cookie is
        # host-only, so a sign-in started on www can never complete (oauth_state_expired).
        if ($host = www.rumia.co.ke) {
            return 301 https://rumia.co.ke$request_uri;
        }

        # SSL Certificates (Managed by Certbot)
        ssl_certificate /etc/letsencrypt/live/rumia.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rumia.co.ke/privkey.pem;

        # SSL Parameters & Security Optimization
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Route API requests to FastAPI Backend container
        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend:8000/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Rumia-Client-IP "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # FastAPI Interactive Swagger Docs
        location /docs {
            proxy_pass http://backend:8000/docs;
            proxy_set_header Host $host;
        }

        # Route web requests to Next.js Frontend container
        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Rumia-Client-IP "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Auth responses carry large header blocks (Supabase session JWTs in
            # Set-Cookie plus CSP/security headers). The default proxy buffer
            # (4k-8k) is too small, and nginx replies 502 "upstream sent too big
            # header" exactly on the login success path /login page RSC requests.
            proxy_buffer_size 32k;
            proxy_buffers 8 32k;
        }
    }
}
