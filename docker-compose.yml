services:
  # ──────────────────────────────────────
  # APPLICATION SERVICES
  # ──────────────────────────────────────

  # ──────────────────────────────────────
  # DATABASE (self-hosted; replaces Supabase Postgres)
  # ──────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: rumia_postgres
    restart: always
    # Loopback only: reachable from the host (backups, psql) and the docker network.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-rumia}
      - POSTGRES_USER=${POSTGRES_USER:-rumia}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rumia-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Public URL used at BUILD time: ISR pages prerender during `next build`
        # and the container build network cannot resolve "backend", so they must
        # fetch through the public domain. The runtime override below
        # (environment:) points the running server at the internal docker URL.
        - NEXT_PUBLIC_API_BASE_URL=https://rumia.co.ke/api/v1
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://rumia.co.ke}
        # Public env vars must be present at build time. Values come from the
        # shell environment / .env.production via docker compose automatically.
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        - NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-}
        - NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
        - SENTRY_ORG=${SENTRY_ORG:-}
        - SENTRY_PROJECT=${SENTRY_PROJECT:-}
        - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN:-}
    container_name: rumia_web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      # Runtime server secrets (R2, VAPID, service role). Build-time NEXT_PUBLIC_*
      # come from the same file via Next's dotenv loader during pnpm build.
      - ./web/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=https://rumia.co.ke
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000/api/v1
    healthcheck:
      # Next's standalone server binds only to the container's eth0 IP, so
      # localhost/127.0.0.1 are refused; target it via the container's HOSTNAME.
      test: ["CMD-SHELL", "node -e \"fetch('http://'+process.env.HOSTNAME+':3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - rumia-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rumia_backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      # Scheduled jobs run once, in the worker service below, not in every gunicorn worker.
      - RUN_SCHEDULER=false
    networks:
      - rumia-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Scheduled jobs (delivery retries, announcement cleanup). Run exactly one replica.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rumia_worker
    restart: always
    command: ["python", "-m", "app.worker"]
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - RUN_SCHEDULER=true
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rumia-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: rumia_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - rumia-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: rumia_certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:

networks:
  rumia-network:
    driver: bridge
